kind: classification
dataset_id: theatticusproject/cuad-qa
# Empirically measured: 10-label + 2000-char clause input → 533 tokens worst case.
# 768 leaves headroom and avoids truncating long clauses.
max_length: 768

training:
  pilot_epochs: 1
  larger_epochs: 2
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  warmup_ratio: 0.05
  weight_decay: 0.01
