kind: generation
dataset_id: bitext/Bitext-customer-support-llm-chatbot-training-dataset
# Empirically measured: chat-template + user query + response p95 ~430 tokens,
# max ~580 tokens. 1024 leaves room for completion-only loss layout.
max_length: 1024

training:
  pilot_epochs: 1
  larger_epochs: 2
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  warmup_ratio: 0.05
  weight_decay: 0.01
