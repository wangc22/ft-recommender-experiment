kind: classification
dataset_id: PolyAI/banking77
# Empirically measured: 77-label prompt = 404 tokens; +completion+buffer = ~440.
# 512 fits comfortably with no truncation.
max_length: 512

training:
  pilot_epochs: 1
  larger_epochs: 2
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_ratio: 0.05
  weight_decay: 0.01
